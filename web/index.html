<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#c7c1d3;font:11px -apple-system,BlinkMacSystemFont,sans-serif}canvas{width:100%;height:calc(100% - 46px);display:block;touch-action:none}.word{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:clamp(45px,15vw,84px);font-weight:800;letter-spacing:-5px;color:#302938;opacity:.5;pointer-events:none;z-index:-1}#status{position:absolute;inset:45% 15px auto;text-align:center;font-size:12px}.rotate{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;font-size:9px;letter-spacing:1.2px;color:#a8a0b6}button{border:1px solid #42384f;background:#19141f;border-radius:50%;color:#d6cce7;width:27px;height:27px;cursor:pointer}body.compact canvas{height:100%}body.compact .rotate,body.compact .word{display:none}button:focus-visible{outline:2px solid #a18aff;outline-offset:2px}
</style></head><body><div class="word" aria-hidden="true">EVOLVE</div><canvas aria-label="Faceless Blender avatar. Drag to rotate."></canvas><div id="status">Loading your avatar…</div><div class="rotate"><button data-left aria-label="Rotate left">←</button><span>DRAG TO ROTATE</span><button data-right aria-label="Rotate right">→</button></div><script src="model.js"></script><script src="viewer.js"></script></body></html>
